[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "exposeye"
version = "0.1.0"
description = "Passive-first OSINT exposure toolkit: domain recon, open ports & CVEs, email breach checks and change monitoring, as a desktop app and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Steven" }]
keywords = [
    "osint", "recon", "attack-surface", "dns", "security", "certificate-transparency",
    "data-breach", "cve", "monitoring", "cli",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "dnspython>=2.4",
    "requests>=2.31",
    "certifi",
    "rich>=13.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
exposeye = "exposeye.cli:main"
exposeye-app = "exposeye.app:main"
exposeye-email = "exposeye.email_cli:main"
exposeye-watch = "exposeye.watch_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exposeye"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# embedded PowerShell script lines can't be wrapped
"src/exposeye/monitor/notify.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
