[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "domainscope"
version = "0.1.0"
description = "Passive-first domain reconnaissance (OSINT) toolkit that produces HTML, Markdown and JSON reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Steven" }]
keywords = ["osint", "recon", "dns", "security", "certificate-transparency", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "dnspython>=2.4",
    "requests>=2.31",
    "certifi",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
domainscope = "domainscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/domainscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
