<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exposeye</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M2.5 16C6 9.5 10.5 6.5 16 6.5S26 9.5 29.5 16C26 22.5 21.5 25.5 16 25.5S6 22.5 2.5 16Z" stroke-width="2.4"/>
        <circle cx="16" cy="16" r="5.6" stroke-width="2.2"/>
        <path d="M16 8.6v3M16 20.4v3M8.6 16h3M20.4 16h3" stroke-width="2.2"/>
        <circle cx="16" cy="16" r="2.2" class="dot"/>
      </svg>
      <span>exposeye</span>
    </a>
    <a class="btn btn-primary btn-block" href="#/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New scan
    </a>
    <nav class="side-nav" aria-label="Tools">
      <div class="side-label">Recon</div>
      <a class="side-link" id="monitorLink" href="#/monitor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg>Monitoring
        <span class="badge-count" id="monitorBadge" hidden>0</span>
      </a>
      <div class="side-label">Lab</div>
      <a class="side-link" id="decoderLink" href="#/lab/decode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/></svg>Decoder
      </a>
      <a class="side-link" id="fileLink" href="#/lab/file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><circle cx="11" cy="14" r="2.5"/><path d="M13 16l2.5 2.5"/></svg>File analyser
      </a>
      <a class="side-link" id="hashLink" href="#/lab/hash">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3L8 21M16 3l-2 18M3 9h18M3 15h18"/></svg>Hashes
      </a>
      <a class="side-link" id="jwtLink" href="#/lab/jwt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h.01M12 12h.01M17 12h.01"/></svg>JWT
      </a>
      <a class="side-link" id="rsaLink" href="#/lab/rsa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a3 3 0 103-3M10 11l9-9M16 5l3 3M14 7l2 2"/></svg>RSA
      </a>
      <a class="side-link" id="cipherLink" href="#/lab/cipher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a2 2 0 012-2h2M20 7V5a2 2 0 00-2-2h-2M4 17v2a2 2 0 002 2h2M20 17v2a2 2 0 01-2 2h-2M8 12h8M12 8v8"/></svg>Ciphers
      </a>
    </nav>
    <div class="side-label">Recent scans</div>
    <ul class="history" id="history"><li class="history-empty">No scans yet</li></ul>
    <a class="side-link" id="settingsLink" href="#/settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings
    </a>
    <a class="side-link kofi" href="https://ko-fi.com/ashtricks" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13a3 3 0 010 6h-1M4 5v8a4 4 0 004 4h5a4 4 0 004-4M8 9h.01"/></svg>Support on Ko-fi
    </a>
    <div class="side-foot" id="sideFoot">Runs locally on your PC</div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
